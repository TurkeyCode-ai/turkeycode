<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note sent | TurkeyCode</title>
<style>
  :root {
    --cream: #f6ecd9; --paper: #fffaf0; --stone: #2a221c; --rust: #b4441c; --gold: #d9952b; --muted: #6b5d50;
    --edge: 3px solid var(--stone); --drop: 6px 6px 0 var(--rust);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--cream); color: var(--stone); font-family: var(--sans); font-size: 18px; line-height: 1.55; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .hero { background: #000; color: var(--cream); padding: 44px 0 52px; }
  .tag { display: inline-block; background: var(--gold); color: var(--stone); font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; }
  h1 { font-size: clamp(34px, 7vw, 68px); line-height: 0.98; text-transform: uppercase; letter-spacing: -0.02em; margin: 20px 0 0; font-weight: 900; }
  main { padding: 40px 0 72px; }
  .quote { background: var(--paper); border: var(--edge); box-shadow: var(--drop); padding: 18px 20px; font-size: 21px; font-weight: 700; max-width: 34em; margin: 0 0 22px; }
  p { margin: 0 0 14px; max-width: 38em; }
  footer { border-top: var(--edge); padding: 22px 0 40px; font-family: var(--mono); font-size: 14px; }
  @media (max-width: 520px) { body { font-size: 17px; } .quote { font-size: 18px; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="tag">Contact</span>
    <h1>Note sent</h1>
  </div>
</header>

<main class="wrap">
  <p class="quote">Thanks. Your note has been sent.</p>
  <p><a href="/">Back to the front page</a></p>
</main>

<footer>
  <div class="wrap"><a href="/sdd/">About SDD</a></div>
</footer>
</body>
</html>
